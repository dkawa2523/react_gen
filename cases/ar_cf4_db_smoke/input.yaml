schema_version: 1
case:
  name: ar_cf4_db_smoke
  description: Minimal Ar/CF4 semiconductor low-pressure plasma smoke workflow using local fixture data.
gases:
  - Ar
  - CF4
profile: low_pressure_plasma_v1
expansion:
  max_depth: 2
outputs:
  reactions: true
  states: true
  dnt_tasks: true
  dnt_inputs: true
  missing_data: true
  csv_summary: true
data_policy:
  include_incomplete_reactions: true
  include_reactions_without_cross_section: true
  include_reactions_without_dnt_ready_properties: true
  allowed_status:
    - curated
    - literature_supported
    - imported
    - estimated
    - draft
  exclude_status:
    - deprecated
