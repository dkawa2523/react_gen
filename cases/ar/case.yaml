name: ar
gases: [Ar]

# A pure argon inductively coupled discharge: the simplest case the workflow
# has, and the one where every reaction in the list is curated. Useful as a
# reference point, because anything the generator adds here would be an
# invention rather than a gap being filled.
conditions:
  pressure_Pa: 1.3
  gas_temperature_K: 400.0
  electron_temperature_eV: 3.0
  electron_density_m3: 5.0e+16
  volume_m3: 0.021
  surface_area_m2: 0.52

surfaces: [SiO2]

accept_status: [curated, literature_supported]
