schema_version: 1
case:
  name: ar_o2
  description: Runtime Ar/O2 example assembled from reusable species and binary reactions
gases:
- Ar
- O2
expansion:
  propagate_excited_states: true
data_policy:
  include_incomplete_reactions: true
  include_reactions_without_cross_section: true
  include_reactions_without_dnt_ready_properties: true
  allowed_status:
  - curated
  - literature_supported
