schema_version: 1
id: CF4
display_name: CF4
composition:
  C: 1
  F: 4
charge: 0
classes:
- neutral
- molecule
state:
  kind: ground
  label: X
  excitation_energy_eV: 0.0
properties:
  mass_amu:
    value: 88.0043
    unit: amu
    source: NIST Chemistry WebBook SRD 69
  polarizability_A3:
    value: 2.824
    unit: A3
    source: NIST CCCBDB experimental data for CF4; Olney et al. Chem. Phys. 223 (1997)
      59-98
    quality: curated
    note: Primary isotropic polarizability for public-data-backed registry use. See
      dnt_polarizability_alt_A3 for transport-fit alternative sometimes used in Ar+/CF4
      mobility work.
  dipole_moment_D:
    value: 0.0
    unit: D
    source: Td symmetry of CF4
  collision_radius_A:
    value: 2.35
    unit: A
    source: engineering DNT short-range seed from kinetic-diameter scale about 4.7
      A / 2; not a curated fundamental constant
    quality: estimated
    note: Effective short-range core radius for preprocessing. Tune/replace during
      DNT+ calibration or import from a transport set.
  enthalpy_formation_eV:
    value: -9.671936443224865
    unit: eV
    source: NIST Chemistry WebBook SRD 69, ΔfH°gas=-933.20 kJ/mol
  ionization_energy_eV:
    value: 14.7
    unit: eV
    source: NIST Chemistry WebBook SRD 69, evaluated IE <=14.7 eV
    note: vertical determinations are around 16.2 eV; see vertical_ionization_energy_eV.
  electron_affinity_eV:
    value: null
    unit: eV
    source: Bjarnason et al., Int. J. Mass Spectrom. 339-340, 45-53 (2013),
      CF4 attachment proceeds through an unstable transient parent anion
    status: unbound
    note: Do not substitute fragment-anion appearance energy for the parent-molecule
      electron affinity.
  vertical_ionization_energy_eV:
    value: 16.2
    unit: eV
    source: NIST Chemistry WebBook SRD 69, vertical IE determinations ~16.2 eV
  dnt_polarizability_alt_A3:
    value: 3.86
    unit: A3
    source: Ar+ in CF4 transport-set literature; adopted in Stojanović/Nikitović-style
      mobility fitting, not the primary molecular polarizability.
    quality: transport_fit_alternative
    note: Use only when reproducing specific ion-mobility/transport-set assumptions;
      do not silently replace polarizability_A3.
metadata:
  status: estimated
  notes:
  - Core input gas. Thermochemistry, dipole, IE and polarizability are public-data-backed;
    DNT short-range collision radius remains an engineering seed.
  - Primary polarizability_A3=2.824 A3 is from NIST CCCBDB. dnt_polarizability_alt_A3=3.86
    A3 is retained only for transport-fit reproduction.
