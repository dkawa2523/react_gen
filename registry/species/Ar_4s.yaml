metadata:
  status: literature_supported
  notes:
  - The four 3p5 4s levels (1s5 11.548, 1s4 11.624, 1s3 11.723, 1s2 11.828 eV in NIST
    ASD) are carried as one lumped manifold at 11.6 eV.
  - Two levels are metastable and two are resonant. This mixed umbrella is compatible
    evidence for Ar(m) and Ar(r), but exact evidence for neither submanifold.
  - Resolving the manifold requires separate radiative and quenching data and must
    replace the umbrella in a numerical selection, not sit beside it.
  - Collision radius and polarizability of the excited state are acquisition gaps.
  - A representative lumped level energy does not define population-weighted thermodynamics;
    the shifted ground NASA fit was withdrawn.
