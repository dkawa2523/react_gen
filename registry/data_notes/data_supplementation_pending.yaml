  - Original coefficient-specific temperature/pressure range
  - original referenced measurement or evaluation
  - uncertainty and nominal-model scope
  current_evidence: Reaction table transcription and order/units confirmed previously; original coefficient
    applicability remains unknown.
  acquisition: Official DOI full text request returns HTTP 403. Existing author proof/index is insufficient
    for cited coefficient conditions.
  next_action: Obtain licensed original report and coefficient-specific references; add only conditions
    actually established there.
  independent_generation_alternatives:
    neutralization_or_charge_transfer: State-resolved collision calculation or measurement plus relative-energy
      distribution; total capture alone does not fix product branching.
    neutral_activated_reactions: PES and transition-state calculations with explicit thermal assumptions,
      or measured k(T).
    association: PES, stabilization and bath-gas-specific RRKM/master equation or measured pressure-dependent
      rates.
    qualification: None of these reconstructs the original fitted record conditions; retain a new method/source
      record.
