schema_version: 1
name: internal_first
active_sources:
  - local_registry
  - local_assets
optional_sources:
  - internal_file
  - chemical_identity_snapshot
  - nist_snapshot
  - argonne_atct_snapshot
  - chemicals_optional
  - lxcat_offline
  - ion_reaction_table
disabled_sources:
  - pubchem_online
  - vamdc
  - openadas
external_only_sources:
  - pubchem_fetch
  - lxcat_raw_import
  - openadas_raw_import
  - vamdc_query
species_identity:
  - internal_species_db
  - local_registry
  - chemical_identity_snapshot
  - pubchem_offline
properties:
  - internal_property_db
  - local_registry
  - nist_snapshot
  - argonne_atct_snapshot
  - chemicals_optional
electron_cross_sections:
  - internal_cross_section_db
  - local_assets
  - lxcat_offline
ion_neutral_reactions:
  - internal_reaction_db
  - local_registry
  - literature_candidates
pubchem:
  enabled: false
  mode: online
  cache_dir: external_data/pubchem/cache
policy:
  prefer_status:
    - curated
    - literature_supported
    - imported
    - estimated
    - inferred
  require_review_for:
    - conflicting_values
    - estimated_collision_radius
    - llm_extracted
