schema_version: 1
name: local_only
species_identity:
  - local_registry
properties:
  - local_registry
electron_cross_sections:
  - local_assets
ion_neutral_reactions:
  - local_registry
pubchem:
  enabled: false
  mode: online
  cache_dir: external_data/pubchem/cache
policy:
  prefer_status:
    - curated
    - literature_supported
    - imported
    - estimated
    - inferred
  require_review_for:
    - conflicting_values
    - estimated_collision_radius
    - llm_extracted
