curation_decisions:
- Mixtures are not registered. Species and binary reaction pairs are reusable across all input-gas combinations.
- Synthetic benchmark cross-section assets are not copied into the shared registry.
- NIST SRD 107 total-ionization tables are imported only into an explicit site-local prepared registry.
- The 2026 evaluated O2 workbook is imported only by an explicit command; CC BY-NC data are not bundled in the shared registry.
- Thresholds are recorded only when an evaluated or measured value is available.
- Collision radii are labeled estimated because they are half of literature kinetic diameters, not fundamental constants.
