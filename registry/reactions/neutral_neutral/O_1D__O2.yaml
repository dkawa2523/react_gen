      evidence_tier: derived
      id: ds_O1D_O2_quenching_b1Sigma_rate_jpl_19_5
      independent_variable: gas_temperature
      kind: rate_coefficient
      notes:
      - Branch rate is the evaluated total disappearance rate multiplied by the recommended
        0.80 yield.
      - Ea in K denotes Ea/kB; the negative value gives exp(+55/T). Tref=298 K is
        a normalization convention with b=0.
      - The saved expression and historical range remain inspectable, but no coefficient
        is returned for an unresolved J-specific product branch.
      observable: reaction_rate
      parameter_units:
        A: m3/s
        Ea: K
        branching_fraction: '1'
        branching_fraction_uncertainty: '1'
        source_total_A: cm3/s
        total_A: m3/s
      parameters:
        A: 2.64e-17
        Ea: -55.0
        b: 0.0
        branching_fraction: 0.8
        branching_fraction_uncertainty: 0.2
        source_total_A: 3.3e-11
        total_A: 3.3e-17
      preferred: true
      reaction_order: 2
      reference_temperature_K: 298.0
      representation: arrhenius
      source:
        applicability_review: Historical 104-424 K is the experimental-data span,
          not the current recommendation. This record is retained as nonapplicable
          to the O(3P2)-specific target; the new term-summed target uses Note A3 100-400
          K.
        citation: NASA/JPL Evaluation 19-5, Table 1A and Note A3, O(1D) + O2.
        product_state_scope: The source resolves O2 electronic products but sums O(3P)
          over fine structure; it does not determine the O(3P2)-specific channel.
        source_id: JPL-19-5:A3
        source_type: evaluated_kinetics
        total_rate_uncertainty: Table 1A declares f(298 K)=1.10 and g=10; not combined
          with branch uncertainty here.
        url: https://jpldataeval.jpl.nasa.gov/pdf/NASA-JPL%20Evaluation%2019-5.pdf
        value_origin: Nominal electronic-state channel rate derived from evaluated
          total loss times branching fraction.
      status: literature_supported
      uncertainty:
        note: Source branching fraction is 0.80 +/- 0.20; no combined channel-rate
          uncertainty is assigned.
      unit: m3/s
      validity:
        maximum: 424.0
        minimum: 104.0
        quantity: gas_temperature
        unit: K
