schema_version: 1
case: Ar/CF4 starter registry
scope: state/property values and reaction-channel definitions for low-pressure plasma network generation and DNT+/DNT+DM preprocessing
numeric_cross_sections: not_imported
status_convention:
  curated: channel/property identity is supported by public/evaluated source; numeric CS may still require import
  estimated: startup value/channel for network expansion or DNT preprocessing; replace or validate before production simulation
  deprecated: excluded by generator
thermochemistry_notes:
  enthalpy_formation_eV: stored as eV per molecule, converted from kJ/mol where applicable
  deltaE_products_minus_reactants_eV: positive means endothermic in product-minus-reactant convention
known_limitations:
- Numeric cross-section arrays are not included; electron channels report needs_import until LXCat/NIST/literature data are imported.
- CF3 and CF2 neutral transport properties required by DNT+DM are intentionally missing.
- CF4 collision_radius_A is a practical seed parameter; pair-specific hard-sphere or rigid-core parameters should be handled by the downstream DNT+ adapter when available.
- Some fragment appearance thresholds are estimated placeholders where public summaries did not provide exact channel thresholds.
