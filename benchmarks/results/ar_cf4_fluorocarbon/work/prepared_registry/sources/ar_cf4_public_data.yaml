schema_version: 1
scope: Ar/CF4 public-data starter registry
numeric_cross_sections: not_imported
thermochemistry_convention: enthalpy_formation_eV is eV per molecule; deltaE_products_minus_reactants_eV > 0 means endothermic.
main_sources:
  nist_chemistry_webbook: species molecular weights, gas-phase thermochemistry, ion energetics for CF4/CF3/CF2/F.
  nist_atomic_data: Ar and F atomic ionization energies and atomic weights.
  nist_cccbdb: polarizability data source to be used for final curation; some fragment values are currently estimated.
  lxcat_bordage_phelps: planned source/import target for electron collision cross-section curves.
  nakano_sugai_1992: e + CF4 neutral dissociation thresholds for CF3 and CF2 production.
  sieglaff_rejoub_lindsay_stebbings_2001: partial electron-impact ionization products of CF4.
  peko_dyakov_champion_rao_olthoff_1999: CF3+ and F+ with CF4, and F- + CF4 detachment.
  dnt_plus_2022: DNT+ model scope and Ar+--CF4 validation/example.
  dnt_plus_dm_2024: ADO/dipole extension for polar molecules.
curation_decisions:
- Ar+ + CF4 -> Ar + CF3+ + F is the active Ar+/CF4 reactive charge-transfer channel.
- Parent CF4+ charge-transfer channels are retained only as surrogate/estimated bookkeeping channels.
- CF3 dipole moment is registered from the molecular-beam focusing measurement as 0.43 D.
- CF2 dipole moment remains unregistered in this pass.
- Numerical cross-section arrays remain external and must be imported separately.
