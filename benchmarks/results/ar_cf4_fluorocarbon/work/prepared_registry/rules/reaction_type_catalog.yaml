schema_version: 1
electron:
  elastic:
    expands_species: false
    requires_cross_section: true
    default_propagate_products: false
  effective:
    expands_species: false
    requires_cross_section: true
    default_propagate_products: false
  excitation:
    expands_species: false
    requires_cross_section: true
    default_propagate_products: false
  ionization:
    expands_species: true
    requires_cross_section: true
    default_propagate_products: true
  dissociation:
    expands_species: true
    requires_cross_section: true
    default_propagate_products: true
  dissociative_ionization:
    expands_species: true
    requires_cross_section: true
    default_propagate_products: true
  attachment:
    expands_species: true
    requires_cross_section: true
    default_propagate_products: true
ion_neutral:
  elastic:
    expands_species: false
    requires_dnt_class: true
    default_dnt_class: elastic
    default_propagate_products: false
  charge_transfer:
    expands_species: true
    requires_dnt_class: true
    default_dnt_class: long_range_charge_exchange
    default_propagate_products: true
  dissociative_charge_transfer:
    expands_species: true
    requires_dnt_class: true
    default_dnt_class: short_range_charge_exchange
    default_propagate_products: true
  reactive_scattering:
    expands_species: true
    requires_dnt_class: true
    default_dnt_class: reactive_inelastic
    default_propagate_products: true
    allowed_dnt_classes:
    - reactive_inelastic
    - electron_detachment
    - collision_induced_dissociation
  ion_impact_ionization:
    expands_species: true
    requires_dnt_class: true
    default_dnt_class: ion_impact_ionization
    default_propagate_products: true
  electron_detachment:
    expands_species: true
    requires_dnt_class: true
    default_dnt_class: inelastic_detachment
    default_propagate_products: true
