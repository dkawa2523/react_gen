schema_version: 1

expansion:
  max_depth: 2
  propagate_species_classes:
    - neutral
    - radical
    - positive_ion
    - negative_ion
  propagate_excited_states: false

collisions:
  electron:
    enabled: true
    targets:
      - neutral
      - radical

  ion_neutral:
    enabled: true
    projectiles:
      - positive_ion
      - negative_ion
    targets:
      - neutral
      - radical

limits:
  max_species: 150
  max_reactions: 2000
  max_pairs_per_depth: 1000
  max_missing_pairs_per_depth: 100
