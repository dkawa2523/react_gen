schema_version: 1
setup:
  config: benchmarks/benchmark_setup.yaml
  require_success: true
write_plots: true
write_report: true
benchmarks:
  - id: ar_o2_simple
    case: benchmarks/cases/ar_o2_simple/input.yaml
    registry: registry
    source_profile: benchmarks/fixtures/ar_o2_simple/source_profile.yaml
    workspace: benchmarks/results/ar_o2_simple/work
    output: benchmarks/results/ar_o2_simple/outputs
    expectation: benchmarks/expectations/ar_o2_simple.yaml
    external_solvers: benchmarks/external_solvers.example.yaml
    cross_section_imports:
      - file: benchmarks/fixtures/ar_o2_simple/cross_sections/e_O2_elastic.csv
        source: local_file
        reaction_id: e_O2_elastic
        target: O2
        license_note: synthetic benchmark fixture
    cross_section_mapping: benchmarks/fixtures/ar_o2_simple/cross_section_mapping.yaml
  - id: ar_cf4_fluorocarbon
    case: benchmarks/cases/ar_cf4_fluorocarbon/input.yaml
    registry: registry
    source_profile: benchmarks/fixtures/ar_cf4_fluorocarbon/source_profile.yaml
    workspace: benchmarks/results/ar_cf4_fluorocarbon/work
    output: benchmarks/results/ar_cf4_fluorocarbon/outputs
    expectation: benchmarks/expectations/ar_cf4_fluorocarbon.yaml
    external_solvers: benchmarks/external_solvers.example.yaml
    cross_section_imports:
      - file: benchmarks/fixtures/ar_cf4_fluorocarbon/cross_sections/e_CF4_elastic.csv
        source: local_file
        reaction_id: e_CF4_elastic
        target: CF4
        license_note: synthetic benchmark fixture
    cross_section_mapping: benchmarks/fixtures/ar_cf4_fluorocarbon/cross_section_mapping.yaml
  - id: sf6_o2_electronegative
    case: benchmarks/cases/sf6_o2_electronegative/input.yaml
    registry: registry
    source_profile: benchmarks/fixtures/sf6_o2_electronegative/source_profile.yaml
    workspace: benchmarks/results/sf6_o2_electronegative/work
    output: benchmarks/results/sf6_o2_electronegative/outputs
    expectation: benchmarks/expectations/sf6_o2_electronegative.yaml
    external_solvers: benchmarks/external_solvers.example.yaml
    cross_section_imports:
      - file: benchmarks/fixtures/sf6_o2_electronegative/cross_sections/e_SF6_elastic.csv
        source: local_file
        reaction_id: e_SF6_elastic
        target: SF6
        license_note: synthetic benchmark fixture
      - file: benchmarks/fixtures/sf6_o2_electronegative/cross_sections/e_O2_elastic.csv
        source: local_file
        reaction_id: e_O2_elastic
        target: O2
        license_note: synthetic benchmark fixture
    cross_section_mapping: benchmarks/fixtures/sf6_o2_electronegative/cross_section_mapping.yaml
