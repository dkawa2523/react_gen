schema_version: 1
solvers:
  bolsig_plus:
    enabled: false
    required_for:
      - optional_transport_validation
    executable: null
    adapter: export_only
    install:
      mode: manual_or_user_path
      notes:
        - Download and license/copyright terms must be reviewed by the user.
  ngspice:
    enabled: false
    required_for:
      - optional_circuit_coupling_smoke
    executable: null
    adapter: ngspice_basic
    install:
      mode: package_manager_or_user_path
      commands:
        windows:
          - winget install ngspice
        macos:
          - brew install ngspice
        linux:
          - sudo apt-get install ngspice
  thunderboltz:
    enabled: false
    executable: null
    adapter: export_only
    install:
      mode: user_source_or_executable_path
  loki_b:
    enabled: false
    executable: null
    adapter: export_only
    install:
      mode: user_source_or_executable_path
  zdplaskin:
    enabled: false
    executable: null
    adapter: export_only
    install:
      mode: manual_or_user_path
