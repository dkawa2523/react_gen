schema_version: 1
case: ar_o2_simple
required_species:
  - Ar
  - O2
  - Ar+
  - O2+
  - O
  - O-
required_reaction_families:
  - electron
  - ion_neutral
required_reaction_types:
  electron:
    - elastic
    - ionization
    - dissociation
    - attachment
  ion_neutral:
    - elastic
    - charge_transfer
required_outputs:
  - network.reactions.yaml
  - network.states.yaml
  - dnt_tasks.yaml
  - missing_data.yaml
  - summary.json
forbidden:
  reactions_with_failed_balance: true
