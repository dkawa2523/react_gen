schema_version: 2
policy:
  core_network_access: forbidden
  automatic_registry_write: forbidden
  ambiguous_match: review_queue
  large_assets: reference_by_path_and_checksum

sources:
- source_id: lxcat
  access: manual_export
  converter: acquire lxcat EXPORT.txt --out WORK
  provides: [electron_cross_section]
  review: [license, citation, complete_set, momentum_transfer, channel_scope]

- source_id: umist
  access: manual_release
  converter: acquire umist RATE.rates --out WORK
  provides: [two_body_rate_coefficient]
  review: [release_terms, row_reference, plasma_temperature_range]

- source_id: nist_asd
  access: explicit_public_query
  converter: acquire asd ELEMENT --out WORK
  provides: [atomic_state_energy]
  review: [citation, level_assignment, metastable_or_resonant_class]

- source_id: nist_cccbdb
  access: manual_html_export
  converter: acquire cccbdb states.yaml --out WORK
  provides: [polarizability]
  review: [citation, formula, electronic_state]

- source_id: cantera_nasa
  access: optional_local_package
  converter: acquire nasa states.yaml --out WORK
  provides: [nasa7]
  review: [mechanism_source, composition, charge, temperature_range]

- source_id: chemicals
  access: optional_local_package
  converters:
  - acquire molecular states.yaml --out WORK
  - acquire thermo states.yaml --out WORK
  provides: [transport_property, formation_enthalpy]
  review: [package_license, underlying_source, formula, state]

- source_id: pubchem
  access: explicit_public_api
  converter: acquire pubchem states.yaml --out WORK
  provides: [identity]
  review: [citation, formula, identifiers]
  restriction: identity is not reaction evidence

- source_id: atct
  access: manual_snapshot
  converter: null
  provides: [formation_enthalpy]
  review: [license, citation, state, sign_convention, uncertainty]

- source_id: vamdc
  access: manual_snapshot
  converter: null
  provides: [state_and_collision_records]
  review: [node_rights, source_citation, state_mapping, unit, channel_scope]

- source_id: openadas
  access: manual_snapshot
  converter: null
  provides: [atomic_collision_data]
  review: [redistribution, adf_type, species_mapping, unit, range]

- source_id: quantemol_qdb
  access: licensed_manual_snapshot
  converter: null
  provides: [plasma_reaction_and_cross_section]
  review: [license, reaction_mapping, state_mapping, unit, channel_scope]

handoff: rgen ingest SNAPSHOT --bundle OUTPUTS --overlay OVERLAY
