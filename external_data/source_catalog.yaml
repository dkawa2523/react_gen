schema_version: 3
policy:
  analysis_network_access: forbidden
  selection: explicit_analysis_request
  catalog_scope: Access routes and quantities; registration does not approve scientific
    records or grant redistribution rights. Providers may also be supplied explicitly
    in user data without catalog registration.
sources:
- source_id: lxcat
  provides:
  - electron_cross_section
  access: manual_export
  converters:
  - acquire lxcat EXPORT.txt --out WORK
  endpoint: https://us.lxcat.net/
  rights:
    status: check_source_and_upstream
    review_items:
    - license
    - citation
    - complete_set
    - momentum_transfer
    - channel_scope
- source_id: umist
  provides:
  - two_body_rate_coefficient
  access: manual_release
  converters:
  - acquire umist RATE.rates --out WORK
  endpoint: https://umistdatabase.uk/downloads
  rights:
    status: check_source_and_upstream
    review_items:
    - release_terms
    - row_reference
    - plasma_temperature_range
  file: https://umistdatabase.uk/files/rate22_final.rates
  format: umist
  format_version: RATE22
- source_id: nist_asd
  provides:
  - atomic_state_energy
  access: explicit_public_query
  converters:
  - acquire asd ELEMENT --out WORK
  endpoint: https://physics.nist.gov/PhysRefData/ASD/Html/levelshelp.html
  rights:
    status: check_source_and_upstream
    review_items:
    - citation
    - level_assignment
    - metastable_or_resonant_class
- source_id: nist_cccbdb
  provides:
  - polarizability
  access: saved_html_or_explicit_public_query
  converters:
  - acquire cccbdb RESULT.yaml --page PAGE.html --out WORK
  endpoint: https://cccbdb.nist.gov/
  rights:
    status: check_source_and_upstream
    review_items:
    - citation
    - formula
    - electronic_state
- source_id: cantera
  provides:
  - nasa7
  access: optional_local_package
  converters:
  - acquire nasa RESULT.yaml --out WORK
  endpoint: https://cantera.org/stable/yaml/species.html
  rights:
    status: check_source_and_upstream
    review_items:
    - mechanism_source
    - composition
    - charge
    - temperature_range
- source_id: chemicals
  provides:
  - transport_property
  - formation_enthalpy
  access: optional_local_package
  converters:
  - acquire molecular RESULT.yaml --out WORK
  - acquire thermo RESULT.yaml --out WORK
  endpoint: https://chemicals.readthedocs.io/
  rights:
    status: check_source_and_upstream
    review_items:
    - package_license
    - underlying_source
    - formula
    - state
- source_id: pubchem
  provides:
  - identity
  access: explicit_public_api
  converters:
  - acquire pubchem RESULT.yaml --out WORK
  endpoint: https://pubchem.ncbi.nlm.nih.gov/docs/
  rights:
    status: check_source_and_upstream
    review_items:
    - citation
    - formula
    - identifiers
  scope: identity is not reaction evidence
- source_id: atct
  provides:
  - formation_enthalpy
  access: manual_snapshot
  converters: []
  endpoint: https://atct.anl.gov/index.html
  rights:
    status: check_source_and_upstream
    review_items:
    - license
    - citation
    - state
    - sign_convention
    - uncertainty
- source_id: vamdc
  provides:
  - state_and_collision_records
  access: manual_snapshot
  converters: []
  endpoint: https://vamdc.org/
  rights:
    status: check_source_and_upstream
    review_items:
    - node_rights
    - source_citation
    - state_mapping
    - unit
    - channel_scope
- source_id: openadas
  provides:
  - atomic_collision_data
  access: manual_snapshot
  converters: []
  endpoint: https://open.adas.ac.uk/
  rights:
    status: check_source_and_upstream
    review_items:
    - redistribution
    - adf_type
    - species_mapping
    - unit
    - range
- source_id: qdb
  provides:
  - plasma_reaction_and_cross_section
  access: licensed_manual_snapshot
  converters: []
  endpoint: https://quantemoldb.com/reactions/api-docs/
  rights:
    status: check_source_and_upstream
    review_items:
    - license
    - reaction_mapping
    - state_mapping
    - unit
    - channel_scope
- source_id: mendeleev
  provides:
  - atomic_ionization_energy
  - atomic_electron_affinity
  access: optional_local_package
  converters:
  - acquire atoms ELEMENT --out WORK
  endpoint: https://mendeleev.readthedocs.io/en/latest/data.html
  rights:
    status: check_source_and_upstream
- source_id: pyromat
  provides:
  - ideal_gas_enthalpy
  access: optional_local_package
  converters:
  - acquire idealgas SPECIES.yaml --out WORK
  endpoint: https://chmarti1.github.io/PYroMat/
  rights:
    status: check_source_and_upstream
- source_id: internal_vibration
