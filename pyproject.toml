[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "plasma-reactgen"
version = "0.1.0"
description = "File-registry based reaction network generator for low-pressure plasma modeling"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pyyaml>=6.0"
]

[project.optional-dependencies]
thermo = ["chemicals>=1.3", "mendeleev>=0.15", "pyromat>=2.2"]
# tools/visualize.py only. The core stays on PyYAML alone: a bundle is
# complete without pictures, so plotting is not worth a runtime dependency.
visualize = ["matplotlib>=3.8", "networkx>=3.2"]
quality = [
  "bandit==1.8.6",
  "coverage==7.10.2",
  "detect-secrets==1.5.0",
  "diff-cover==9.6.0",
  "hypothesis==6.138.2",
  "import-linter==2.3",
  "mypy==1.17.1",
  "nox==2025.5.1",
  "pip-audit==2.9.0",
  "pytest==9.1.0",
  "pytest-cov==6.2.1",
  "radon==6.0.1",
  "ruff==0.12.7",
  "types-PyYAML==6.0.12.20260724",
  "vulture==2.14",
]

[project.scripts]
rgen = "reactgen.cli:main"
acquire = "acquire.cli:main"
discover = "discover.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = ["--strict-markers"]
markers = [
  "e2e: end-to-end workflow tests",
  "integration: tests spanning process or filesystem boundaries",
  "property: Hypothesis property-based tests",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = [
  ".git",
  ".mypy_cache",
  ".pytest_cache",
  ".ruff_cache",
  ".venv",
  "build",
  "dist",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "A", "TID", "PT", "RUF", "S", "C90"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]
"tools/quality.py" = ["S603"]

[tool.mypy]
python_version = "3.11"
files = ["src/reactgen", "src/acquire", "src/discover", "tools/quality.py", "noxfile.py"]
exclude = ["build", "benchmarks/results"]
check_untyped_defs = true
no_implicit_optional = true
show_error_codes = true
warn_redundant_casts = true
warn_unreachable = true
warn_unused_configs = true

[[tool.mypy.overrides]]
# These are optional, acquisition-only dependencies. numpy ships inline types
# written for 3.12, which the 3.11 target above cannot parse, so their contents
# are not analysed here — only the calls into them, which stay checked.
module = ["chemicals.*", "numpy.*", "mendeleev.*", "pyromat.*"]
follow_imports = "skip"
follow_imports_for_stubs = true
ignore_missing_imports = true
ignore_errors = true

[tool.coverage.run]
branch = true
source = ["reactgen", "acquire", "discover"]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = true

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
targets = ["src"]

[tool.vulture]
paths = ["src"]
exclude = [".venv"]
min_confidence = 60

