[project]
name = "plasma-reactgen"
version = "0.1.0"
description = "File-registry based reaction network generator for low-pressure plasma modeling"
requires-python = ">=3.11"
dependencies = [
  "pyyaml>=6.0"
]

[project.scripts]
reactgen = "plasma_reactgen.interface.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
