[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "plasma-reactgen"
dynamic = ["version"]
description = "Registry-independent plasma reaction candidate generator with evidence assessment"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "Pillow>=10.0",
  "pyyaml>=6.0"
]

[project.optional-dependencies]
thermo = ["chemicals>=1.3", "mendeleev>=0.15", "pyromat>=2.2"]
quality = [
  "import-linter==2.3",
  "mypy==1.17.1",
  "nox==2025.5.1",
  "pytest==9.1.0",
  "ruff==0.12.7",
  "types-PyYAML==6.0.12.20260724",
]

[project.scripts]
rgen = "reactgen.cli:main"
acquire = "acquire.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = ["--strict-markers"]
markers = [
  "e2e: end-to-end workflow tests",
  "integration: tests spanning process or filesystem boundaries",
  "property: Hypothesis property-based tests",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "reactgen.__version__"}

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = [
  ".git",
  ".mypy_cache",
  ".pytest_cache",
  ".ruff_cache",
  ".venv",
  "build",
  "dist",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "A", "TID", "PT", "RUF", "S", "C90"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]
"tools/quality.py" = ["S603"]

[tool.mypy]
python_version = "3.11"
files = ["src/reactgen", "src/acquire", "tools/quality.py", "noxfile.py"]
exclude = ["build", "benchmarks/results"]
check_untyped_defs = true
no_implicit_optional = true
show_error_codes = true
warn_redundant_casts = true
warn_unreachable = true
warn_unused_configs = true

[[tool.mypy.overrides]]
# These are optional, acquisition-only dependencies. numpy ships inline types
# written for 3.12, which the 3.11 target above cannot parse, so their contents
# are not analysed here — only the calls into them, which stay checked.
module = ["chemicals.*", "numpy.*", "mendeleev.*", "pyromat.*"]
follow_imports = "skip"
follow_imports_for_stubs = true
ignore_missing_imports = true
ignore_errors = true

