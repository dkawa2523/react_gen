[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "plasma-reactgen"
version = "0.1.0"
description = "File-registry based reaction network generator for low-pressure plasma modeling"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pyyaml>=6.0"
]

[project.optional-dependencies]
external-data = [
  "defusedxml>=0.7.1",
]
quality = [
  "bandit==1.8.6",
  "coverage==7.10.2",
  "detect-secrets==1.5.0",
  "diff-cover==9.6.0",
  "defusedxml>=0.7.1",
  "hypothesis==6.138.2",
  "import-linter==2.3",
  "mutmut==3.3.1; platform_system != 'Windows'",
  "mypy==1.17.1",
  "nox==2025.5.1",
  "pip-audit==2.9.0",
  "pytest==9.1.0",
  "pytest-cov==6.2.1",
  "radon==6.0.1",
  "ruff==0.12.7",
  "types-PyYAML==6.0.12.20260724",
  "types-defusedxml==0.7.0.20260504",
  "vulture==2.14",
]

[project.scripts]
reactgen = "plasma_reactgen.interface.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = ["--strict-markers"]
markers = [
  "e2e: end-to-end workflow tests",
  "integration: tests spanning process or filesystem boundaries",
  "property: Hypothesis property-based tests",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = [
  ".git",
  ".mypy_cache",
  ".pytest_cache",
  ".ruff_cache",
  ".venv",
  "benchmarks/results",
  "build",
  "dist",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "A", "TID", "PT", "RUF", "S", "C90"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]
"tools/quality.py" = ["S603"]
"external_data_tools/http_client.py" = ["S310"]

[tool.mypy]
python_version = "3.11"
files = ["src/plasma_reactgen", "external_data_tools", "tools/quality.py", "noxfile.py"]
exclude = ["build", "benchmarks/results"]
check_untyped_defs = true
no_implicit_optional = true
show_error_codes = true
warn_redundant_casts = true
warn_unreachable = true
warn_unused_configs = true

[tool.coverage.run]
branch = true
source = ["plasma_reactgen", "external_data_tools"]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = true

[tool.bandit]
exclude_dirs = ["build", "tests", ".venv", "benchmarks/results"]
targets = ["src", "external_data_tools"]

[tool.vulture]
paths = ["src", "external_data_tools"]
exclude = ["build", ".venv", "benchmarks/results"]
min_confidence = 60

[tool.mutmut]
paths_to_mutate = [
  "src/plasma_reactgen/domain/equations.py",
  "src/plasma_reactgen/domain/formula.py",
  "src/plasma_reactgen/validation/validators.py",
]
tests_dir = [
  "tests/test_equations.py",
  "tests/test_validators.py",
  "tests/test_species_candidates.py",
  "tests/test_reaction_outputs.py",
]
