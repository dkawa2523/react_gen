name: Quality Nightly

on:
  schedule:
    - cron: "0 17 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality-nightly:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project and pinned quality tools
        run: python -m pip install -e ".[quality]"

      - name: Run nightly quality gate
        run: python tools/quality.py quality-nightly

      - name: Upload nightly analysis results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-nightly-results
          path: build/nightly
          if-no-files-found: warn
