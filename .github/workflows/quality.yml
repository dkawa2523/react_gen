name: Quality PR

on:
  pull_request:
  push:
    branches: [main, update1_refine, update2_db]

permissions:
  contents: read

jobs:
  quality-pr:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project and pinned quality tools
        run: python -m pip install -e ".[quality]"

      - name: Select changed-line coverage base
        shell: bash
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [[ -n "$PR_BASE" ]]; then
            echo "QUALITY_BASE_REF=$PR_BASE" >> "$GITHUB_ENV"
          elif git rev-parse HEAD^ >/dev/null 2>&1; then
            echo "QUALITY_BASE_REF=HEAD^" >> "$GITHUB_ENV"
          fi

      - name: Run pull-request quality gate
        run: python -m nox -s quality-pr

      - name: Upload quality reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-pr-reports
          path: build/quality
          if-no-files-found: warn
