name: Quality PR

on:
  pull_request:
  push:
    branches: [main, update1_refine, update2_db]

permissions:
  contents: read

jobs:
  quality-pr:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project and pinned quality tools
        run: python -m pip install -e ".[quality]"

      - name: Run pull-request quality gate
        run: python tools/quality.py quality-pr
